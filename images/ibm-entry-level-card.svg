<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="IBM is tripling entry-level hiring in 2026">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#313e3b"/>
      <stop offset="1" stop-color="#27322f"/>
    </linearGradient>
    <pattern id="lines" width="120" height="800" patternUnits="userSpaceOnUse">
      <line x1="0.5" y1="0" x2="0.5" y2="800" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <rect width="1200" height="800" fill="url(#lines)"/>
  <circle cx="1040" cy="150" r="14" fill="#d5d52b"/>
  <circle cx="170" cy="660" r="9" fill="#d5d52b"/>
  <text x="110" y="440" font-family="'Space Grotesk', 'Segoe UI', Arial, sans-serif" font-size="340" font-weight="700" fill="#d5d52b" letter-spacing="-12">3&#215;</text>
  <text x="120" y="540" font-family="'Space Grotesk', 'Segoe UI', Arial, sans-serif" font-size="58" font-weight="600" fill="#ffffff">entry-level hiring at IBM in 2026</text>
  <text x="120" y="610" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="40" font-weight="400" fill="#ffffff" fill-opacity="0.7">including software developers</text>
</svg>
